[build]
  publish = "public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["express"]
  included_files = [
    "qbs_production_specification.json",
    "scripts/qbs-cross-stock-cross-sectional-v4.9.1.js"
  ]

# Upload Excel endpoint (harus di atas wildcard /api/*)
[[redirects]]
  from = "/api/upload-excel"
  to = "/.netlify/functions/upload-excel"
  status = 200
  force = true

# Wildcard API lainnya (untuk backward compatibility)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true