<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CHARTNALIST | Smartwatchlist</title>

  <style>
    :root {
      --bg: #050607;
      --surface: #0d1012;
      --surface-2: #111518;
      --line: #20262a;
      --text: #f5f7f8;
      --muted: #8b959c;
      --cyan: #00d9ff;
      --green: #00d084;
      --red: #ff4d4d;
      --yellow: #f5b700;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .terminal {
      min-height: 100vh;
      padding: 28px 30px 42px;
    }

    .topbar {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
    }

    .eyebrow {
      color: var(--cyan);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
      margin-bottom: 7px;
    }

    h1 {
      margin: 0;
      font-size: 25px;
      line-height: 1.1;
      letter-spacing: -.02em;
    }

    .subtitle {
      color: var(--muted);
      margin-top: 7px;
      font-size: 12px;
    }

    .meta {
      color: var(--muted);
      font-size: 11px;
      text-align: right;
      white-space: nowrap;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
    }

    .filters {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .filter {
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--muted);
      padding: 8px 13px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .07em;
      cursor: pointer;
    }

    .filter:hover {
      border-color: #364047;
      color: var(--text);
    }

    .filter.active {
      border-color: rgba(0, 217, 255, .45);
      color: var(--cyan);
      background: rgba(0, 217, 255, .06);
    }

    .filter-count {
      display: inline-block;
      min-width: 14px;
      margin-left: 4px;
      padding: 1px 4px;
      border-radius: 3px;
      background: rgba(255,255,255,.05);
      font-size: 9px;
      font-variant-numeric: tabular-nums;
    }

    .filter.active .filter-count {
      background: rgba(0,217,255,.10);
    }

    .ticker-link {
      color: inherit;
      text-decoration: none;
    }

    .ticker-link:hover .ticker {
      color: var(--cyan);
    }

    .refresh {
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
      padding: 8px 13px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .07em;
      cursor: pointer;
    }

    .refresh:hover {
      border-color: #364047;
    }

    .table-shell {
      border: 1px solid var(--line);
      background: var(--surface);
      overflow: hidden;
      border-radius: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    thead {
      background: #090c0e;
    }

    th {
      color: #68737a;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .11em;
      text-align: left;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      white-space: nowrap;
    }

    td {
      padding: 13px 14px;
      border-bottom: 1px solid rgba(32, 38, 42, .72);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    tbody tr:hover {
      background: rgba(255,255,255,.018);
    }

    tbody tr:last-child td {
      border-bottom: 0;
    }

    .ticker {
      color: var(--text);
      font-weight: 800;
      letter-spacing: .04em;
    }

    .name {
      color: var(--muted);
      font-size: 10px;
      margin-top: 3px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .setup {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .07em;
    }

    .setup.BREAKOUT {
      color: var(--cyan);
    }

    .setup.PULLBACK {
      color: #aeb8ff;
    }

    .setup.ACCUMULATION {
      color: var(--yellow);
    }

    .state {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 4px 8px;
      border: 1px solid var(--line);
      border-radius: 5px;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: .08em;
    }

    .state.WATCH {
      color: var(--yellow);
      border-color: rgba(245,183,0,.25);
    }

    .state.TRIGGERED {
      color: var(--cyan);
      border-color: rgba(0,217,255,.28);
    }

    .state.ACTIVE {
      color: var(--green);
      border-color: rgba(0,208,132,.28);
    }

    .state.OBSERVE {
      color: var(--muted);
    }

    .num {
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    th.num {
      text-align: right;
    }

    .risk-low {
      color: var(--green);
    }

    .risk-medium {
      color: var(--yellow);
    }

    .risk-high {
      color: var(--red);
    }

    .empty {
      padding: 58px 20px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
    }

    .empty strong {
      display: block;
      color: var(--text);
      margin-bottom: 6px;
    }

    .loading {
      opacity: .55;
    }

    @media (max-width: 1000px) {
      .terminal {
        padding: 18px;
      }

      .table-shell {
        overflow-x: auto;
      }

      table {
        min-width: 1080px;
      }

      .topbar,
      .toolbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .meta {
        text-align: left;
      }
    }
  </style>

  <script src="/assets/stockfamily-sidebar.js"></script>
<style id="chartnalist-brand-only-final">
  .sf-header-logo { display:none !important; }
  .sf-header-brand { gap:0 !important; }
  .sf-header-title {
    color:#F5F7F8 !important;
    font-weight:800 !important;
    letter-spacing:.045em !important;
  }
  .sf-header-title-accent {
    color:#00D9FF !important;
  }

  #stockfamily-global-sidebar .sf-mark {
    display:none !important;
  }

  #stockfamily-global-sidebar .sf-brand-copy {
    display:none !important;
  }

  #stockfamily-global-sidebar .sf-brand::after {
    content:"CHARTNALIST";
    display:block;
    color:#F5F7F8;
    font-family:inherit;
    font-size:14px;
    font-weight:800;
    line-height:1;
    letter-spacing:.035em;
    white-space:nowrap;
  }

  #stockfamily-global-sidebar .sf-brand {
    gap:0 !important;
    overflow:hidden !important;
  }
</style>
<style id="chartnalist-smartwatchlist-polish">
.filter { transition:all .16s ease; }
.filter:hover { transform:translateY(-1px); }
.filter-count { min-width:18px; }
.signal-table tbody tr { transition:background .16s ease, transform .16s ease; }
.signal-table tbody tr:hover { background:rgba(255,255,255,.025); }
.lifecycle-badge,
.setup-badge,
.risk-badge {
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:24px;
  padding:4px 8px;
  border-radius:6px;
  font-size:11px;
  font-weight:800;
  letter-spacing:.045em;
  white-space:nowrap;
}
.lifecycle-badge.TRIGGERED,
.lifecycle-badge.ACTIVE {
  color:#00D084;
  background:rgba(0,208,132,.09);
  border:1px solid rgba(0,208,132,.24);
}
.lifecycle-badge.WATCH,
.lifecycle-badge.OBSERVE {
  color:#F5B700;
  background:rgba(245,183,0,.08);
  border:1px solid rgba(245,183,0,.20);
}
.setup-badge {
  color:#00D9FF;
  background:rgba(0,217,255,.07);
  border:1px solid rgba(0,217,255,.20);
}
.risk-badge.LOW {
  color:#00D084;
  background:rgba(0,208,132,.07);
  border:1px solid rgba(0,208,132,.18);
}
.risk-badge.MEDIUM {
  color:#F5B700;
  background:rgba(245,183,0,.07);
  border:1px solid rgba(245,183,0,.18);
}
.risk-badge.HIGH {
  color:#FF4D4D;
  background:rgba(255,77,77,.07);
  border:1px solid rgba(255,77,77,.18);
}
.rr-value {
  font-weight:800;
  color:#F5F7F8;
}
.smartwatch-freshness {
  margin-left:8px;
  color:#626B72;
}
.smartwatch-freshness.live {
  color:#00D084;
}
@media (max-width:900px) {
  .signal-table { min-width:980px; }
}
</style></head>

<body>
  <main class="terminal">
    <header class="topbar">
      <div>
        <div class="eyebrow">Trading Intelligence</div>
        <h1>Smartwatchlist</h1>
        <div class="subtitle">
          Setup-driven monitoring using the existing Signal Engine lifecycle.
        </div>
      </div>

      <div class="meta" id="meta">
        Loading signal universe...
      </div>
    </header>

    <section class="toolbar">
      <div class="filters" id="filters">
        <button class="filter active" data-filter="ALL">ALL <span class="filter-count" data-count="ALL">0</span></button>
        <button class="filter" data-filter="OBSERVE">OBSERVE <span class="filter-count" data-count="OBSERVE">0</span></button>
        <button class="filter" data-filter="WATCH">WATCH <span class="filter-count" data-count="WATCH">0</span></button>
        <button class="filter" data-filter="TRIGGERED">TRIGGERED <span class="filter-count" data-count="TRIGGERED">0</span></button>
        <button class="filter" data-filter="ACTIVE">ACTIVE <span class="filter-count" data-count="ACTIVE">0</span></button>
      </div>

      <button class="refresh" id="refreshBtn">REFRESH</button>
    </section>

    <section class="table-shell">
      <table>
        <thead>
          <tr>
            <th style="width:17%">TICKER</th>
            <th style="width:13%">SETUP</th>
            <th style="width:11%">STATE</th>
            <th class="num" style="width:11%">PRICE</th>
            <th class="num" style="width:11%">TRIGGER</th>
            <th class="num" style="width:12%">INVALIDATION</th>
            <th class="num" style="width:9%">TARGET 1</th>
            <th class="num" style="width:9%">TARGET 2</th>
            <th class="num" style="width:7%">R:R</th>
          </tr>
        </thead>

        <tbody id="rows">
          <tr>
            <td colspan="9">
              <div class="empty loading">
                Loading Smartwatchlist...
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>

  <script>
    const state = {
      all: [],
      filter: "ALL",
    };

    const rowsEl = document.getElementById("rows");
    const metaEl = document.getElementById("meta");
    const refreshBtn = document.getElementById("refreshBtn");

    function esc(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function number(value) {
      const n = Number(value);
      return Number.isFinite(n)
        ? n.toLocaleString("id-ID", {
            maximumFractionDigits: 2,
          })
        : "—";
    }

    function rr(value) {
      const n = Number(value);
      return Number.isFinite(n)
        ? n.toFixed(2) + "R"
        : "—";
    }

    function riskClass(value) {
      return value
        ? "risk-" + String(value).toLowerCase()
        : "";
    }

    function updateFilterCounts() {
      const counts = {
        ALL: state.all.length,
        OBSERVE: state.all.filter(row => row.status === "OBSERVE").length,
        WATCH: state.all.filter(row => row.status === "WATCH").length,
        TRIGGERED: state.all.filter(row => row.status === "TRIGGERED").length,
        ACTIVE: state.all.filter(row => row.status === "ACTIVE").length,
      };

      Object.entries(counts).forEach(([status, count]) => {
        const el = document.querySelector(`[data-count="${status}"]`);
        if (el) el.textContent = count;
      });
    }

    function render() {
      updateFilterCounts();

      const visible =
        state.filter === "ALL"
          ? state.all
          : state.all.filter(row => row.status === state.filter);

      if (!visible.length) {
        rowsEl.innerHTML = `
          <tr>
            <td colspan="9">
              <div class="empty">
                <strong>No signals in this state</strong>
                Smartwatchlist only surfaces existing Signal Engine states.
              </div>
            </td>
          </tr>
        `;
        return;
      }

      rowsEl.innerHTML = visible.map(row => `
        <tr data-code="${esc(row.stockCode)}">
          <td>
            <a class="ticker-link" href="/stock.html?code=${encodeURIComponent(row.stockCode)}">
              <div class="ticker">${esc(row.stockCode)}</div>
              <div class="name">${esc(row.stockName || "")}</div>
            </a>
          </td>

          <td>
            <span class="setup ${esc(row.setup)}">
              ${esc(row.setup)}
            </span>
          </td>

          <td>
            <span class="state ${esc(row.status)}">
              ${esc(row.status)}
            </span>
          </td>

          <td class="num">${formatPrice(row.price)}</td>
          <td class="num">${formatPrice(row.trigger)}</td>
          <td class="num">${formatPrice(row.invalidation)}</td>
          <td class="num">${formatPrice(row.target1)}</td>
          <td class="num">${formatPrice(row.target2)}</td>
          <td class="num ${riskClass(row.riskLevel)}">${formatRR(row.riskReward)}</td>
        </tr>
      `).join("");
    }

    function formatPrice(value) {
      const n = Number(value);

      if (!Number.isFinite(n)) return "—";

      if (Number.isInteger(n)) {
        return n.toLocaleString("id-ID");
      }

      return n.toLocaleString("id-ID", {
        minimumFractionDigits: 0,
        maximumFractionDigits: 2,
      });
    }

    function formatRR(value) {
      const n = Number(value);

      if (!Number.isFinite(n)) return "—";

      return `${n.toFixed(1).replace(/\.0$/, "")}R`;
    }
    async function load() {
      refreshBtn.disabled = true;
      refreshBtn.textContent = "LOADING...";

      try {
        /*
         * The persistent localStorage watchlist remains the user's universe.
         * If empty, Smartwatchlist remains empty. Discovery belongs to Screener.
         */
        const saved = JSON.parse(
          localStorage.getItem("watchlist") || "[]"
        );

        const codes = Array.isArray(saved)
          ? saved
              .map(item => {
                if (typeof item === "string") return item;
                return item?.code || item?.stockCode || item?.symbol;
              })
              .filter(Boolean)
              .map(code => String(code).toUpperCase())
          : [];

        const query =
          codes.length
            ? "?codes=" + encodeURIComponent(codes.join(","))
            : "";

        const response = await fetch(
          "/api/public/smartwatchlist" + query,
          {
            cache: "no-store",
          }
        );

        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error(
            data.message || data.error || "Smartwatchlist failed"
          );
        }

        state.all = Array.isArray(data.stocks)
          ? data.stocks
          : [];

        metaEl.textContent =
          `${state.all.length} signal${state.all.length === 1 ? "" : "s"} · ` +
          `${data.date || "no trade date"}`;

        render();
      } catch (error) {
        console.error(error);

        state.all = [];

        metaEl.textContent = "Signal engine unavailable";

        rowsEl.innerHTML = `
          <tr>
            <td colspan="9">
              <div class="empty">
                <strong>Unable to load Smartwatchlist</strong>
                ${esc(error.message || "Unknown error")}
              </div>
            </td>
          </tr>
        `;
      } finally {
        refreshBtn.disabled = false;
        refreshBtn.textContent = "REFRESH";
      }
    }

    document.querySelectorAll(".filter").forEach(button => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".filter")
          .forEach(item => item.classList.remove("active"));

        button.classList.add("active");

        state.filter = button.dataset.filter;

        render();
      });
    });

    refreshBtn.addEventListener("click", load);

    load();
  </script>
<script id="chartnalist-smartwatchlist-polish-js">
(() => {
  const originalRender = window.render;
  const decorate = () => {
    const rows = document.querySelectorAll(".signal-table tbody tr");
    const byCode = new Map((state?.all || []).map(row => [String(row.stockCode || "").toUpperCase(), row]));
    rows.forEach(tr => {
      const cells = tr.querySelectorAll("td");
      if (cells.length < 9) return;
      const code = String(cells[0]?.innerText || "").trim().toUpperCase();
      const item = byCode.get(code);
      const setup = String(cells[1]?.innerText || "").trim();
      const lifecycle = String(cells[2]?.innerText || "").trim();
      if (setup && !cells[1].querySelector(".setup-badge")) {
        cells[1].innerHTML = '<span class="setup-badge">'+setup+'</span>';
      }
      if (lifecycle && !cells[2].querySelector(".lifecycle-badge")) {
        cells[2].innerHTML = '<span class="lifecycle-badge '+lifecycle+'">'+lifecycle+'</span>';
      }
      if (cells[8] && !cells[8].querySelector(".rr-value")) {
        cells[8].innerHTML = '<span class="rr-value">'+cells[8].innerHTML+'</span>';
      }
      if (item?.riskLevel && !tr.querySelector(".risk-cell")) {
        const td=document.createElement("td");
        td.className="risk-cell";
        td.innerHTML='<span class="risk-badge '+String(item.riskLevel).toUpperCase()+'">'+String(item.riskLevel).toUpperCase()+'</span>';
        tr.appendChild(td);
      }
    });
    const header=document.querySelector(".signal-table thead tr");
    if(header && !header.querySelector(".risk-header")){
      const th=document.createElement("th");
      th.className="risk-header";
      th.textContent="RISK";
      header.appendChild(th);
    }
    const meta=document.getElementById("meta");
    if(meta && !meta.querySelector(".smartwatch-freshness")){
      const span=document.createElement("span");
      span.className="smartwatch-freshness live";
      span.textContent=" • LIVE";
      meta.appendChild(span);
    }
  };
  const observer=new MutationObserver(()=>requestAnimationFrame(decorate));
  const table=document.querySelector(".signal-table");
  if(table) observer.observe(table,{childList:true,subtree:true});
  window.setInterval(()=>{
    if(typeof load==="function") load();
  },60000);
  requestAnimationFrame(decorate);
})();
</script></body>
</html>
