<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CHARTNALIST | Smartwatchlist</title>

  <style>
    :root {
      --bg: #050607;
      --surface: #0d1012;
      --surface-2: #111518;
      --line: #20262a;
      --text: #f5f7f8;
      --muted: #8b959c;
      --cyan: #00d9ff;
      --green: #00d084;
      --red: #ff4d4d;
      --yellow: #f5b700;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .terminal {
      min-height: 100vh;
      padding: 28px 30px 42px;
    }

    .topbar {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
    }

    .eyebrow {
      color: var(--cyan);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
      margin-bottom: 7px;
    }

    h1 {
      margin: 0;
      font-size: 25px;
      line-height: 1.1;
      letter-spacing: -.02em;
    }

    .subtitle {
      color: var(--muted);
      margin-top: 7px;
      font-size: 12px;
    }

    .meta {
      color: var(--muted);
      font-size: 11px;
      text-align: right;
      white-space: nowrap;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
    }

    .filters {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .filter {
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--muted);
      padding: 8px 13px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .07em;
      cursor: pointer;
    }

    .filter:hover {
      border-color: #364047;
      color: var(--text);
    }

    .filter.active {
      border-color: rgba(0, 217, 255, .45);
      color: var(--cyan);
      background: rgba(0, 217, 255, .06);
    }

    .filter-count {
      display: inline-block;
      min-width: 14px;
      margin-left: 4px;
      padding: 1px 4px;
      border-radius: 3px;
      background: rgba(255,255,255,.05);
      font-size: 9px;
      font-variant-numeric: tabular-nums;
    }

    .filter.active .filter-count {
      background: rgba(0,217,255,.10);
    }

    .ticker-link {
      color: inherit;
      text-decoration: none;
    }

    .ticker-link:hover .ticker {
      color: var(--cyan);
    }

    .refresh {
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
      padding: 8px 13px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .07em;
      cursor: pointer;
    }

    .refresh:hover {
      border-color: #364047;
    }

    .table-shell {
      border: 1px solid var(--line);
      background: var(--surface);
      overflow: hidden;
      border-radius: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    thead {
      background: #090c0e;
    }

    th {
      color: #68737a;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .11em;
      text-align: left;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      white-space: nowrap;
    }

    td {
      padding: 13px 14px;
      border-bottom: 1px solid rgba(32, 38, 42, .72);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    tbody tr:hover {
      background: rgba(255,255,255,.018);
    }

    tbody tr:last-child td {
      border-bottom: 0;
    }

    .ticker {
      color: var(--text);
      font-weight: 800;
      letter-spacing: .04em;
    }

    .name {
      color: var(--muted);
      font-size: 10px;
      margin-top: 3px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .setup {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .07em;
    }

    .setup.BREAKOUT {
      color: var(--cyan);
    }

    .setup.PULLBACK {
      color: #aeb8ff;
    }

    .setup.ACCUMULATION {
      color: var(--yellow);
    }

    .state {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 4px 8px;
      border: 1px solid var(--line);
      border-radius: 5px;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: .08em;
    }

    .state.WATCH {
      color: var(--yellow);
      border-color: rgba(245,183,0,.25);
    }

    .state.TRIGGERED {
      color: var(--cyan);
      border-color: rgba(0,217,255,.28);
    }

    .state.ACTIVE {
      color: var(--green);
      border-color: rgba(0,208,132,.28);
    }

    .state.OBSERVE {
      color: var(--muted);
    }

    .num {
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    th.num {
      text-align: right;
    }

    .risk-low {
      color: var(--green);
    }

    .risk-medium {
      color: var(--yellow);
    }

    .risk-high {
      color: var(--red);
    }

    .empty {
      padding: 58px 20px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
    }

    .empty strong {
      display: block;
      color: var(--text);
      margin-bottom: 6px;
    }

    .loading {
      opacity: .55;
    }

    @media (max-width: 1000px) {
      .terminal {
        padding: 18px;
      }

      .table-shell {
        overflow-x: auto;
      }

      table {
        min-width: 1080px;
      }

      .topbar,
      .toolbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .meta {
        text-align: left;
      }
    }
  </style>

.flag-badge.suspend{color:#ff4d4d;border-color:rgba(255,77,77,.5);background:rgba(255,77,77,.12)}
.flag-badge.plan{color:#ff9f43;border-color:rgba(255,159,67,.5);background:rgba(255,159,67,.1)}
.flag-badge.pre{color:#4dd0ff;border-color:rgba(77,208,255,.5);background:rgba(77,208,255,.1)}
.stop-sub{margin-top:3px;font-size:10px;font-weight:600;opacity:.8}
.stop-sub .flag-badge{margin-top:0;margin-left:4px}
.rr-value {
  font-weight:800;
  color:#F5F7F8;
}
.smartwatch-freshness {
  margin-left:8px;
  color:#626B72;
}
.smartwatch-freshness.live {
  color:#00D084;
}
@media (max-width:900px) {
  .signal-table { min-width:980px; }
}

</div>

    <section class="toolbar">
      <div class="filters" id="filters">

        <button class="filter" data-filter="TARGET">TARGET <span class="filter-count" data-count="TARGET">0</span></button>
        <button class="filter" data-filter="INVALIDATED">INVALIDATED <span class="filter-count" data-count="INVALIDATED">0</span></button>
      </div>

      <button class="refresh" id="refreshBtn">REFRESH</button>
    </section>

      <table>

            <th style="width:17%">TICKER</th>

            <th class="num" style="width:11%">TRIGGER</th>

            <th class="num" style="width:9%">TARGET 1</th>
            <th class="num" style="width:9%">TARGET 2</th>
            <th class="num" style="width:6%" title="Reward:risk dari harga sekarang ke Target 1">R:R T1</th>
            <th style="width:8%">RISK</th>
          </tr>
        </thead>

        <tbody id="rows">
          <tr>
            <td colspan="10">
              <div class="empty loading">
                Loading Smartwatchlist...
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>

  <script>
    const state = {
      all: [],
      filter: "ALL",
    };

    const rowsEl = document.getElementById("rows");
    const metaEl = document.getElementById("meta");
    const refreshBtn = document.getElementById("refreshBtn");

    function esc(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function number(value) {
      const n = Number(value);
      return Number.isFinite(n)
        ? n.toLocaleString("id-ID", {
            maximumFractionDigits: 2,
          })
        : "—";
    }

    function rr(value) {
      const n = Number(value);
      return Number.isFinite(n)
        ? n.toFixed(2) + "R"
        : "—";
    }

    function riskClass(value) {
      return value
        ? "risk-" + String(value).toLowerCase()
        : "";
    }

    function updateFilterCounts() {
      const counts = {
        ALL: state.all.length,
        OBSERVE: state.all.filter(row => row.status === "OBSERVE").length,
        WATCH: state.all.filter(row => row.status === "WATCH").length,
        TRIGGERED: state.all.filter(row => row.status === "TRIGGERED").length,
        ACTIVE: state.all.filter(row => row.status === "ACTIVE").length,
        TARGET: state.all.filter(row => row.status === "TARGET").length,
        INVALIDATED: state.all.filter(row => row.status === "INVALIDATED").length,
      };

      Object.entries(counts).forEach(([status, count]) => {
        const el = document.querySelector(`[data-count="${status}"]`);
        if (el) el.textContent = count;
      });
    }

    function render() {
      updateFilterCounts();

      const visible =
        state.filter === "ALL"
          ? state.all
          : state.all.filter(row => row.status === state.filter);

      if (!visible.length) {
        rowsEl.innerHTML = `
          <tr>
            <td colspan="10">
              <div class="empty">
                <strong>No signals in this state</strong>
                Smartwatchlist only surfaces existing Signal Engine states.
              </div>
            </td>
          </tr>
        `;
        return;
      }

      rowsEl.innerHTML = visible.map(row => `
        <tr data-code="${esc(row.stockCode)}">
          <td>
            <a class="ticker-link" href="/stock.html?code=${encodeURIComponent(row.stockCode)}">
              <div class="ticker">${esc(row.stockCode)}</div>
              <div class="name">${esc(row.stockName || "")}</div>
              ${staleBadge(row)}
              ${row.preBreakout ? '<div class="flag-badge pre" title="Harga masih di bawah trigger. Menunggu close di atas trigger.">PRA-BREAKOUT</div>' : ""}
              ${row.planStale ? '<div class="flag-badge plan" title="Harga sudah di atas batas entry wajar: potensi untung ke Target 1 lebih kecil dari risiko ke stop (di bawah 1 banding 1), atau Target 1 sudah terlewati.">TELAT ENTRY' + (row.maxEntry != null ? ' \u00b7 maks ' + formatPrice(row.maxEntry) : '') + '</div>' : ""}
            </a>
          </td>

          <td>
            <span class="setup ${esc(row.setup)}">
              ${esc(row.setup)}
            </span>
          </td>

          <td>
            <span class="state ${esc(row.status)}">
              ${esc(row.status)}
            </span>
          </td>

          <td class="num">${formatPrice(row.price)}</td>
          <td class="num">${formatPrice(row.trigger)}</td>
          <td class="num">${formatPrice(row.invalidation)}${formatStop(row)}</td>
          <td class="num">${formatPrice(row.target1)}</td>
          <td class="num">${formatPrice(row.target2)}</td>
          <td class="num">${formatRRCell(row)}</td>
          <td class="risk-cell">
            <span class="risk-badge ${esc(row.riskLevel || "")}">
              ${esc(row.riskLevel || "—")}
            </span>
          </td>
        </tr>
      `).join("");
    }

    function formatPrice(value) {
      const n = Number(value);

      if (!Number.isFinite(n)) return "—";

      if (Number.isInteger(n)) {
        return n.toLocaleString("id-ID");
      }

      return n.toLocaleString("id-ID", {
        minimumFractionDigits: 0,
        maximumFractionDigits: 2,
      });
    }

    function staleBadge(row) {
      const idle = Number(row.idleSessions);
      const last = esc(row.latestTradeDate || "");
      if (idle >= 3) return '<div class="flag-badge suspend" title="Tidak ada transaksi ' + idle + ' sesi sejak ' + last + '. Sinyal tidak bisa ditindaklanjuti.">SUSPEND</div>';
      if (idle >= 1) return '<div class="flag-badge stale" title="Tidak ada transaksi pada ' + idle + ' sesi terakhir (candle valid terakhir ' + last + ')">TANPA TRANSAKSI</div>';
      if (row.dataStale) return '<div class="flag-badge stale" title="Data terakhir ' + last + ' (' + esc(row.staleDays) + ' hari tertinggal)">DATA BASI</div>';
      return "";
    }

    function formatStop(row) {
      if (row.stopDistancePct === null || row.stopDistancePct === undefined) return "";
      const d = Number(row.stopDistancePct);
      if (!Number.isFinite(d)) return "";
      const label = "\u2212" + d.toLocaleString("id-ID", { maximumFractionDigits: 1 }) + "%";
      const wide = row.stopWide
        ? ' <span class="flag-badge wide" title="Stop lebih dari 15% dari harga">STOP LEBAR</span>'
        : "";
      return '<div class="stop-sub">' + label + wide + '</div>';
    }

    function formatRRCell(row) {
      const r = Number(row.rrFromPrice);
      if (!Number.isFinite(r)) return formatRR(row.riskReward);
      if (r <= 0) return '<span title="Target 1 sudah terlewati">T1 lewat</span>';
      return (Math.round(r * 100) / 100) + "R";
    }

    function formatRR(value) {
      const n = Number(value);

      if (!Number.isFinite(n)) return "—";

      return `${n.toFixed(1).replace(/\.0$/, "")}R`;
    }
    async function load() {
      refreshBtn.disabled = true;
      refreshBtn.textContent = "LOADING...";

      // CHARTNALIST_WATCHLIST_DB_SYNC
      // Wait for auth client, then refresh localStorage cache from DB.
      if (!window.chartnalistSupabase) {
        await new Promise((resolve) => {
          const t = setTimeout(resolve, 4000);
          window.addEventListener("chartnalist:auth-ready", () => {
            clearTimeout(t); resolve();
          }, { once: true });
        });
      }
      try {
        const sb = window.chartnalistSupabase;
        if (sb) {
          const { data: { user } } = await sb.auth.getUser();
          if (user) {
            const { data, error } = await sb
              .from("watchlist_items")
              .select("stock_code")
              .eq("user_id", user.id)
              .order("created_at", { ascending: false });
            if (!error) {
              const codes = (data || [])
                .map(r => String(r.stock_code || "").toUpperCase())
                .filter(Boolean);
              try { localStorage.setItem("watchlist", JSON.stringify(codes)); } catch (_) {}
            }
          }
        }
      } catch (_) {}

      try {
        /*
         * The persistent localStorage watchlist remains the user's universe.
         * If empty, Smartwatchlist remains empty. Discovery belongs to Screener.
         */
        const saved = JSON.parse(
          localStorage.getItem("watchlist") || "[]"
        );

        const codes = Array.isArray(saved)
          ? saved
              .map(item => {
                if (typeof item === "string") return item;
                return item?.code || item?.stockCode || item?.symbol;
              })
              .filter(Boolean)
              .map(code => String(code).toUpperCase())
          : [];

        const query =
          codes.length
            ? "?codes=" + encodeURIComponent(codes.join(","))
            : "";

        const response = await fetch(
          "/api/public/smartwatchlist" + query,
          {
            cache: "no-store",
          }
        );

        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error(
            data.message || data.error || "Smartwatchlist failed"
          );
        }

        state.all = Array.isArray(data.stocks)
          ? data.stocks
          : [];

        if (!codes.length) {
          metaEl.textContent =
            "Watchlist empty · Add stocks from Stock Detail";
        } else if (!state.all.length) {
          metaEl.textContent =
            `${codes.length} stock${codes.length === 1 ? "" : "s"} monitored · ` +
            "0 active setups";
        } else {
          const marketDataDate = data.date
            ? new Date(`${data.date}T00:00:00`)
            : null;

          const formattedDate =
            marketDataDate && !Number.isNaN(marketDataDate.getTime())
              ? marketDataDate.toLocaleDateString("en-GB", {
                  day: "2-digit",
                  month: "short",
                  year: "numeric",
                })
              : "date unavailable";

          metaEl.textContent =
            `${state.all.length} setup${state.all.length === 1 ? "" : "s"} · ` +
            `Market data: ${formattedDate}`;
        }

        render();
      } catch (error) {
        console.error(error);

        state.all = [];

        metaEl.textContent = "Signal engine unavailable";

        rowsEl.innerHTML = `
          <tr>
            <td colspan="10">
              <div class="empty">
                <strong>Unable to load Smartwatchlist</strong>
                ${esc(error.message || "Unknown error")}
              </div>
            </td>
          </tr>
        `;
      } finally {
        refreshBtn.disabled = false;
        refreshBtn.textContent = "REFRESH";
      }
    }

    document.querySelectorAll(".filter").forEach(button => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".filter")
          .forEach(item => item.classList.remove("active"));

        button.classList.add("active");

        state.filter = button.dataset.filter;

        render();
      });
    });

    refreshBtn.addEventListener("click", load);

    load();
  </script>
<script id="chartnalist-smartwatchlist-polish-js">
(() => {
  const originalRender = window.render;
  const decorate = () => {
    const rows = document.querySelectorAll(".signal-table tbody tr");
    const byCode = new Map((state?.all || []).map(row => [String(row.stockCode || "").toUpperCase(), row]));
    rows.forEach(tr => {
      const cells = tr.querySelectorAll("td");
      if (cells.length < 9) return;
      const code = String(cells[0]?.innerText || "").trim().toUpperCase();
      const item = byCode.get(code);
      const setup = String(cells[1]?.innerText || "").trim();
      const lifecycle = String(cells[2]?.innerText || "").trim();
      if (setup && !cells[1].querySelector(".setup-badge")) {
        cells[1].innerHTML = '<span class="setup-badge">'+setup+'</span>';
      }
      if (lifecycle && !cells[2].querySelector(".lifecycle-badge")) {
        cells[2].innerHTML = '<span class="lifecycle-badge '+lifecycle+'">'+lifecycle+'</span>';
      }
      if (cells[8] && !cells[8].querySelector(".rr-value")) {
        cells[8].innerHTML = '<span class="rr-value">'+cells[8].innerHTML+'</span>';
      }
      if (item?.riskLevel && !tr.querySelector(".risk-cell")) {
        const td=document.createElement("td");
        td.className="risk-cell";
        td.innerHTML='<span class="risk-badge '+String(item.riskLevel).toUpperCase()+'">'+String(item.riskLevel).toUpperCase()+'</span>';
        tr.appendChild(td);
      }
    });
    const header=document.querySelector(".signal-table thead tr");
    if(header && !header.querySelector(".risk-header")){
      const th=document.createElement("th");
      th.className="risk-header";
      th.textContent="RISK";
      header.appendChild(th);
    }
    const meta=document.getElementById("meta");
    if(meta && !meta.querySelector(".smartwatch-freshness")){
      const span=document.createElement("span");
      span.className="smartwatch-freshness live";
      span.textContent=" ”¢ LIVE";
      meta.appendChild(span);
    }
  };
  const observer=new MutationObserver(()=>requestAnimationFrame(decorate));
  const table=document.querySelector(".signal-table");
  if(table) observer.observe(table,{childList:true,subtree:true});
  window.setInterval(()=>{
    if(typeof load==="function") load();
  },60000);
  requestAnimationFrame(decorate);
})();

<script id="CHARTNALIST_SMARTWATCHLIST_V2">
(() => {
  "use strict";

  /*
   * CHARTNALIST SMARTWATCHLIST V2
   *
   * UI/UX layer only.
   * Existing Signal Engine remains authoritative.
   * No new signal calculation is introduced here.
   */

  function bindStockNavigation() {
    document.querySelectorAll("tbody tr[data-code]").forEach(row => {
      const code = row.dataset.code;

      if (!code || row.dataset.cnBound === "1") {
        return;
      }

      row.dataset.cnBound = "1";

      row.addEventListener("dblclick", () => {
        window.location.href =
          "/stock.html?code=" +
          encodeURIComponent(code);
      });
    });
  }

  function improveMeta() {
    const meta = document.getElementById("meta");

    if (!meta) {
      return;
    }

    const text = meta.textContent || "";

    if (
      text.includes("Signal engine unavailable") ||
      text.includes("no trade date")
    ) {
      meta.dataset.cnState = "attention";
    }
  }

  function observeRender() {
    const rows = document.getElementById("rows");

    if (!rows) {
      return;
    }

    const observer = new MutationObserver(() => {
      bindStockNavigation();
      improveMeta();
    });

    observer.observe(rows, {
      childList: true,
      subtree: true
    });

    bindStockNavigation();
    improveMeta();
  }

  function boot() {
    observeRender();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot, {
      once: true
    });
  } else {
    boot();
  }
})();
</script>
