<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockFamily - The Holy Trinity Screener</title>
  <style>
    /* --- RESET & GLOBAL --- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0e17;
      color: #e0e0e0;
      padding: 20px;
      min-height: 100vh;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* --- HEADER --- */
    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 4px;
      background: linear-gradient(135deg, #f7971e, #ffd200);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      color: #888;
      margin-bottom: 30px;
      font-size: 14px;
    }
    .refresh-btn {
      background: #1a1f2e;
      border: 1px solid #2a2f3e;
      color: #e0e0e0;
      padding: 8px 20px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 20px;
      font-size: 14px;
      transition: 0.2s;
    }
    .refresh-btn:hover {
      background: #252b3e;
    }

    /* --- SUMMARY CARDS --- */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 16px;
      margin-bottom: 30px;
    }
    .summary-card {
      background: #1a1f2e;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      border: 1px solid #2a2f3e;
    }
    .summary-card .number {
      font-size: 32px;
      font-weight: 700;
    }
    .summary-card .label {
      font-size: 12px;
      color: #888;
      margin-top: 4px;
    }
    .grand-slam {
      color: #f7971e;
    }
    .gold {
      border-color: #f7971e;
    }

    /* --- TABLE --- */
    .table-wrapper {
      overflow-x: auto;
      background: #1a1f2e;
      border-radius: 12px;
      border: 1px solid #2a2f3e;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 600px;
    }
    th {
      background: #252b3e;
      padding: 12px 16px;
      text-align: left;
      font-size: 12px;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    td {
      padding: 12px 16px;
      border-bottom: 1px solid #2a2f3e;
      font-size: 14px;
    }
    tr:last-child td {
      border-bottom: none;
    }

    /* --- BADGES --- */
    .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      background: #2a2f3e;
      color: #aaa;
    }
    .badge-slam {
      background: #f7971e;
      color: #0a0e17;
    }

    /* --- LOADING & ERROR --- */
    .loading {
      text-align: center;
      padding: 40px;
      color: #888;
    }
    .error {
      text-align: center;
      padding: 40px;
      color: #ff6b6b;
    }

    /* --- FOOTER --- */
    .footer {
      margin-top: 30px;
      color: #555;
      font-size: 12px;
      text-align: center;
    }

    /* --- RESPONSIVE --- */
    @media (max-width: 600px) {
      .summary-grid {
        grid-template-columns: repeat(3, 1fr);
      }
      h1 {
        font-size: 22px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🏆 The Holy Trinity Screener</h1>
    <div class="subtitle">Multi-Source Intelligence • Grand Slam Picks</div>

    <button class="refresh-btn" onclick="loadData()">⟳ Refresh</button>

    <!-- SUMMARY CARDS -->
    <div id="summary" class="summary-grid">
      <div class="summary-card"><div class="number" id="total">-</div><div class="label">Total Saham</div></div>
      <div class="summary-card"><div class="number" id="accumulation">-</div><div class="label">Accumulation</div></div>
      <div class="summary-card"><div class="number" id="oversold">-</div><div class="label">Oversold</div></div>
      <div class="summary-card"><div class="number" id="trusted">-</div><div class="label">Trusted</div></div>
      <div class="summary-card gold"><div class="number grand-slam" id="grandSlam">-</div><div class="label">🏆 GRAND SLAM</div></div>
    </div>

    <!-- TABLE -->
    <div id="tableContainer">
      <div class="loading">⏳ Memuat data...</div>
    </div>

    <div class="footer">StockFamily Screener v1.0 • Data: IDX</div>
  </div>

  <script>
    async function loadData() {
      const container = document.getElementById('tableContainer');
      container.innerHTML = '<div class="loading">⏳ Memuat data...</div>';

      try {
        const response = await fetch('/api/grandslams');
        const data = await response.json();

        if (!data.success) {
          throw new Error(data.error || 'Gagal mengambil data');
        }

        // Update summary
        document.getElementById('total').textContent = data.summary.total;
        document.getElementById('accumulation').textContent = data.summary.accumulation;
        document.getElementById('oversold').textContent = data.summary.oversold;
        document.getElementById('trusted').textContent = data.summary.trusted;
        document.getElementById('grandSlam').textContent = data.summary.grandSlam;

        // Render table
        const grandSlams = data.grandSlams;
        if (!grandSlams || grandSlams.length === 0) {
          container.innerHTML = '<div class="loading">😴 Belum ada Grand Slam hari ini</div>';
          return;
        }

        let html = `<div class="table-wrapper"><table>
          <thead><tr>
            <th>#</th>
            <th>Kode</th>
            <th>Harga</th>
            <th>Power</th>
            <th>Pilar A</th>
            <th>Pilar B</th>
            <th>Pilar C</th>
            <th>Status</th>
          </tr></thead><tbody>`;

        grandSlams.forEach((s, i) => {
          const badge = `<span class="badge badge-slam">🏆 SLAM</span>`;
          html += `<tr>
            <td>${i + 1}</td>
            <td><strong>${s.code}</strong></td>
            <td>${s.close}</td>
            <td>${s.powerScore}</td>
            <td>${s.pilarA}</td>
            <td>${s.pilarB}</td>
            <td>${s.pilarC}</td>
            <td>${badge}</td>
          </tr>`;
        });

        html += '</tbody></table></div>';
        container.innerHTML = html;

      } catch (error) {
        container.innerHTML = `<div class="error">❌ ${error.message}</div>`;
      }
    }

    // Load data on page load
    loadData();

    // Auto refresh every 5 minutes (300.000 ms)
    setInterval(loadData, 300000);
  </script>
</body>
</html>
