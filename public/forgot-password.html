<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — CHARTNALIST</title>
  <link rel="stylesheet" href="/assets/stockfamily-auth.css">
</head>
<body class="sf-auth-page">
  <main class="sf-auth-shell">
    <section class="sf-auth-card">
      <a href="/" class="sf-brand">CHARTNALIST<span></span></a>

      <div class="sf-auth-heading">
        <div class="sf-eyebrow">ACCOUNT RECOVERY</div>
        <h1>Reset password.</h1>
        <p>Enter your email and we'll send you a password reset link.</p>
      </div>

      <form id="forgotPasswordForm" class="sf-form">
        <label>
          Email
          <input id="email" type="email" autocomplete="email" required>
        </label>

        <div id="authMessage" class="sf-message" hidden></div>

        <button type="submit" class="sf-button sf-button-primary sf-button-full">
          Send Reset Link
        </button>
      </form>

      <div class="sf-auth-footer">
        Remember your password?
        <a href="/login">Back to sign in</a>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/stockfamily-auth.js"></script>
</body>
</html>
