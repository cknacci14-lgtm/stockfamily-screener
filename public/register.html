<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — CHARTNALIST</title>
  <link rel="stylesheet" href="/assets/stockfamily-auth.css">
</head>
<body class="sf-auth-page">
  <main class="sf-auth-shell">
    <section class="sf-auth-card">
      <a href="/" class="sf-brand">CHARTNALIST<span></span></a>

      <div class="sf-auth-heading">
        <div class="sf-eyebrow">JOIN CHARTNALIST</div>
        <h1>Create your account.</h1>
        <p>Start building your personal market intelligence workspace.</p>
      </div>

      <form id="registerForm" class="sf-form">
        <label>
          Email
          <input id="email" type="email" autocomplete="email" required>
        </label>

        <label>
          Password
          <input id="password" type="password" autocomplete="new-password" minlength="8" required>
        </label>

        <label>
          Confirm Password
          <input id="passwordConfirm" type="password" autocomplete="new-password" minlength="8" required>
        </label>

        <div id="authMessage" class="sf-message" hidden></div>

        <button type="submit" class="sf-button sf-button-primary sf-button-full">
          Create Account
        </button>
      </form>

      <div class="sf-auth-footer">
        Already have an account?
        <a href="/login">Sign in</a>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/stockfamily-auth.js"></script>
</body>
</html>
