name: Cron expire plans
on:
  schedule:
    - cron: "0 17 * * *"   # 00:00 WIB (17:00 UTC)
  workflow_dispatch:

jobs:
  expire:
    runs-on: ubuntu-latest
    steps:
      - name: Call expire endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS -X POST "https://chartnalis.web.id/api/ops/expire-plans" \
            -H "X-Cron-Secret: $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d "{}"
