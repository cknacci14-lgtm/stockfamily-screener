name: Auto Scrape Yahoo Finance

on:
  schedule:
    - cron: '0 16 * * *'  # Setiap hari jam 16:00 WIB
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm install
      - run: node src/scrapers/autoScraper.js
      - uses: actions/upload-artifact@v3
        with:
          name: daily-data
          path: data/auto_daily_*.json