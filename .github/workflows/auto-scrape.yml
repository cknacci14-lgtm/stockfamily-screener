name: Auto Scrape Yahoo Finance

on:
  schedule:
    - cron: '0 16 * * *'  # Setiap hari jam 16:00 WIB
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run auto scraper
        run: node src/scrapers/autoScraper.js

      - name: Upload daily data artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-data
          path: data/auto_daily_*.json