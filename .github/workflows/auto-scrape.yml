name: Auto Scrape Yahoo Finance

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run auto scraper
        run: node src/scrapers/autoScraper.js

      - name: Run notifier
        run: node src/notifier.js
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Upload daily data artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-data
          path: data/auto_daily_*.json