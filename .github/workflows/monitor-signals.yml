name: Monitor Signals

on:
  schedule:
    - cron: '*/15 2-9 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no DB changes)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: monitor-signals
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      # NO npm install — script pakai native fetch + dotenv optional
      
      - name: Run monitor
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ARJUM_API_KEY: ${{ secrets.ARJUM_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            node scripts/monitor-signals.js --dry-run
          else
            node scripts/monitor-signals.js
          fi
      
      - name: Log completion
        if: always()
        run: echo "Monitor job completed at $(date)"
