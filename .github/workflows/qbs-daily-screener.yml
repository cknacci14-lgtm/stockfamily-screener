name: QBS Daily Screener

on:
  schedule:
    # 17:00 WIB = 10:00 UTC, Monday-Friday
    - cron: '0 10 * * 1-5'
  workflow_dispatch:  # manual trigger

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: '1'
        run: npm install --omit=dev --no-audit --no-fund --ignore-scripts

      - name: Run QBS screener
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node src/screener.js

      - name: Commit updated screener output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/screener_results.json public/results/screener_results.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(qbs): daily screener refresh $(date -u +%Y-%m-%d)"
            git push
          fi